<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spring Couplet AI | 智创春联</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&family=Inter:wght@300;400;600&display=swap');
      
      :root {
        --paper-red: #a71b1b;
        --paper-dark: #7f1d1d;
        --gold: #fbbf24;
      }
      
      body {
        font-family: 'Inter', 'Noto Serif SC', serif;
        background-color: #0c0a09; /* warm black */
        color: #f5f5f4;
        overflow: hidden;
        margin: 0;
        height: 100vh;
      }
      
      .font-calligraphy {
        font-family: 'Ma Shan Zheng', cursive;
      }
      
      /* Rice Paper Texture */
      
      .bg-rice-paper {
        background-color: var(--paper-red);
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
        box-shadow: inset 0 0 30px rgba(0,0,0,0.4);
      }
      
      /* --- Animations --- */
      
      @keyframes float {
        0% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(10px, -15px) rotate(5deg); }
        50% { transform: translate(-5px, 10px) rotate(-5deg); }
        75% { transform: translate(-15px, -5px) rotate(2deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }
      
      @keyframes pulse-gold {
        0%, 100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.2); }
        50% { box-shadow: 0 0 50px rgba(251, 191, 36, 0.6); }
      }
      
      /* 
         State: Floating (Base)
         When 'particle-suck' class is REMOVED, this transition takes over.
         We use ease-out to simulate "explosion/drifting" physics (starts fast, slows down).
      */
      
      .particle-base {
        position: absolute;
        opacity: 0.6;
        transition: top 1.5s ease-out, left 1.5s ease-out, opacity 1.5s ease-out, transform 1.5s ease-out;
      }
      
      /* 
         State: Sucking (Active)
         We use a dramatic cubic-bezier (Ease-In-Expo) to simulate Gravity.
         Particles start slow (far away) and accelerate drastically as they hit the center.
      */
      
      .particle-suck {
        left: 50% !important;
        top: 50% !important;
        opacity: 0.8 !important;
        /* Center anchor point, maintain scale, and swirl */
        transform: translate(-50%, -50%) scale(1) rotate(720deg) !important;
        /* Custom Bezier: Starts very flat, curves sharply up at the end = Massive Acceleration */
        transition: all 1.2s cubic-bezier(0.55, 0.055, 0.675, 0.19); 
      }
      
      .particle-float {
        animation: float 8s infinite ease-in-out;
      }
      
      /* Diamond Fu Character Container */
      
      .doufang-diamond {
        transform: rotate(45deg);
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        overflow: hidden;
      }
      
      /* Inner border decoration for diamond */
      
      .doufang-diamond::after {
        content: '';
        position: absolute;
        inset: 6px;
        border: 2px solid rgba(0,0,0,0.3);
        pointer-events: none;
      }
      
      /* Counter-rotate text inside diamond so it looks upright */
      
      .doufang-text {
        transform: rotate(-45deg);
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
      }
      
      /* Scroll reveal animations */
      
      .scroll-reveal {
        transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      
      /* Utility */
      
      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      /* Vertical writing mode */
      
      .writing-vertical-rl {
        writing-mode: vertical-rl;
        text-orientation: upright;
      }
    </style>

</head>
